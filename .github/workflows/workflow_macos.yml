name: macOS arm64 Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install build dependencies
        run: brew install qt@5 ninja

      - name: Build and package arm64 DMG
        run: ./scripts/package-macos-arm64.sh "${GITHUB_REF_NAME#v}"

      - name: Verify package checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd artifacts && shasum -a 256 -c "xdts_viewer_arm64_v${version}_macos.dmg.sha256")

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/xdts_viewer_arm64_v${version}_macos.dmg" \
            "artifacts/xdts_viewer_arm64_v${version}_macos.dmg.sha256" \
            --verify-tag \
            --title "XDTS Viewer arm64 ${GITHUB_REF_NAME}" \
            --generate-notes
